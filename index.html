<!DOCTYPE html>
<html lang="es" style="color-scheme:dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05050f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon-192.svg">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>Sistema Solar - Simulación Interactiva</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="loader" role="status" aria-live="polite"><div class="spinner"></div><p>Cargando sistema solar…</p></div>

<div id="bg-fixed">
  <canvas id="constellation-canvas"></canvas>
  <div class="star-container"></div>
</div>

<div id="solar-system">
<div class="system-content">
  <button class="sun" onclick="onSunClick()" aria-label="Sol" type="button"></button>
  <div class="orbit" style="--radius:100px;--period:4s;" data-planet="mercury">
    <button class="planet mercury" onclick="onPlanetClick('mercury')" aria-label="Mercurio" type="button"></button>
    <span class="planet-label">Mercurio</span>
  </div>
  <div class="orbit" style="--radius:155px;--period:7s;" data-planet="venus">
    <button class="planet venus" onclick="onPlanetClick('venus')" aria-label="Venus" type="button"></button>
    <span class="planet-label">Venus</span>
  </div>
  <div class="orbit" style="--radius:215px;--period:10s;" data-planet="earth">
    <button class="planet earth" onclick="onPlanetClick('earth')" aria-label="Tierra" type="button">
      <div class="moon-orbit"><button class="moon" onclick="onMoonClick()" aria-label="Luna" type="button"></button></div>
    </button>
    <span class="planet-label">Tierra</span>
  </div>
  <div class="orbit" style="--radius:280px;--period:14s;" data-planet="mars">
    <button class="planet mars" onclick="onPlanetClick('mars')" aria-label="Marte" type="button"></button>
    <span class="planet-label">Marte</span>
  </div>
  <div class="orbit" style="--radius:380px;--period:22s;" data-planet="jupiter">
    <button class="planet jupiter" onclick="onPlanetClick('jupiter')" aria-label="Júpiter" type="button"></button>
    <span class="planet-label">Júpiter</span>
  </div>
  <div class="orbit" style="--radius:480px;--period:30s;" data-planet="saturn">
    <button class="planet saturn" onclick="onPlanetClick('saturn')" aria-label="Saturno" type="button">
      <div class="saturn-rings"></div>
    </button>
    <span class="planet-label">Saturno</span>
  </div>
  <div class="orbit" style="--radius:570px;--period:40s;" data-planet="uranus">
    <button class="planet uranus" onclick="onPlanetClick('uranus')" aria-label="Urano" type="button"></button>
    <span class="planet-label">Urano</span>
  </div>
  <div class="orbit" style="--radius:660px;--period:50s;" data-planet="neptune">
    <button class="planet neptune" onclick="onPlanetClick('neptune')" aria-label="Neptuno" type="button"></button>
    <span class="planet-label">Neptuno</span>
  </div>
  <!-- ASTEROIDES FAMOSOS -->
  <div class="orbit asteroid-orbit" style="--radius:315px;--period:16s;" data-planet="ceres">
    <button class="famous-asteroid ceres" onclick="onAsteroidClick('ceres')" aria-label="Ceres" type="button"></button>
    <span class="planet-label">Ceres</span>
  </div>
  <div class="orbit asteroid-orbit" style="--radius:335px;--period:19s;" data-planet="vesta">
    <button class="famous-asteroid vesta" onclick="onAsteroidClick('vesta')" aria-label="Vesta" type="button"></button>
    <span class="planet-label">Vesta</span>
  </div>
  <div class="orbit asteroid-orbit" style="--radius:350px;--period:21s;" data-planet="pallas">
    <button class="famous-asteroid pallas" onclick="onAsteroidClick('pallas')" aria-label="Pallas" type="button"></button>
    <span class="planet-label">Pallas</span>
  </div>
  <div class="orbit asteroid-orbit" style="--radius:365px;--period:24s;" data-planet="eros">
    <button class="famous-asteroid eros" onclick="onAsteroidClick('eros')" aria-label="Eros" type="button"></button>
    <span class="planet-label">Eros</span>
  </div>
  <!-- ESTRELLAS FAMOSAS (fijas en fondo) -->
  <button class="famous-star" style="left:8%;top:12%;" onclick="onStarClick('sirius')" aria-label="Sirius" type="button">
    <div class="star-dot sirius"></div><span class="star-label">Sirius</span>
  </button>
  <button class="famous-star" style="left:75%;top:8%;" onclick="onStarClick('betelgeuse')" aria-label="Betelgeuse" type="button">
    <div class="star-dot betelgeuse"></div><span class="star-label">Betelgeuse</span>
  </button>
  <button class="famous-star" style="left:50%;top:5%;" onclick="onStarClick('polaris')" aria-label="Polaris" type="button">
    <div class="star-dot polaris"></div><span class="star-label">Polaris</span>
  </button>
  <button class="famous-star" style="left:85%;top:25%;" onclick="onStarClick('vega')" aria-label="Vega" type="button">
    <div class="star-dot vega"></div><span class="star-label">Vega</span>
  </button>
  <button class="famous-star" style="left:15%;top:82%;" onclick="onStarClick('rigel')" aria-label="Rigel" type="button">
    <div class="star-dot rigel"></div><span class="star-label">Rigel</span>
  </button>
  <button class="famous-star" style="left:90%;top:70%;" onclick="onStarClick('antares')" aria-label="Antares" type="button">
    <div class="star-dot antares"></div><span class="star-label">Antares</span>
  </button>
  <button class="famous-star" style="left:5%;top:55%;" onclick="onStarClick('aldebaran')" aria-label="Aldebarán" type="button">
    <div class="star-dot aldebaran"></div><span class="star-label">Aldebarán</span>
  </button>
  <button class="famous-star" style="left:65%;top:88%;" onclick="onStarClick('proxima')" aria-label="Próxima Centauri" type="button">
    <div class="star-dot proxima"></div><span class="star-label">Próx. Centauri</span>
  </button>
  <button class="famous-star" style="left:40%;top:92%;" onclick="onStarClick('canopus')" aria-label="Canopus" type="button">
    <div class="star-dot canopus"></div><span class="star-label">Canopus</span>
  </button>
  <button class="famous-star" style="left:92%;top:48%;" onclick="onStarClick('arcturus')" aria-label="Arcturus" type="button">
    <div class="star-dot arcturus"></div><span class="star-label">Arcturus</span>
  </button>
  <!-- AGUJEROS NEGROS -->
  <button class="blackhole-marker" style="left:18%;top:18%;" onclick="onBlackholeClick('sagittarius')" aria-label="Sagittarius A*" type="button">
    <div class="blackhole-dot sagittarius"></div><span class="blackhole-label">Sgr A*</span>
  </button>
  <button class="blackhole-marker" style="left:35%;top:25%;" onclick="onBlackholeClick('m87')" aria-label="M87*" type="button">
    <div class="blackhole-dot m87"></div><span class="blackhole-label">M87*</span>
  </button>
  <button class="blackhole-marker" style="left:12%;top:35%;" onclick="onBlackholeClick('cygnus')" aria-label="Cygnus X-1" type="button">
    <div class="blackhole-dot"></div><span class="blackhole-label">Cyg X-1</span>
  </button>
  <button class="blackhole-marker" style="left:78%;top:15%;" onclick="onBlackholeClick('cygnusx3')" aria-label="Cygnus X-3" type="button">
    <div class="blackhole-dot"></div><span class="blackhole-label">Cyg X-3</span>
  </button>
  <button class="blackhole-marker" style="left:60%;top:75%;" onclick="onBlackholeClick('grs')" aria-label="GRS 1915+105" type="button">
    <div class="blackhole-dot"></div><span class="blackhole-label">GRS 1915</span>
  </button>
  <button class="blackhole-marker" style="left:25%;top:70%;" onclick="onBlackholeClick('v404')" aria-label="V404 Cygni" type="button">
    <div class="blackhole-dot"></div><span class="blackhole-label">V404 Cyg</span>
  </button>
  <div class="asteroid-belt" id="asteroid-belt"></div>
</div>
</div>

<div id="controls">
  <div class="controls-header">
    <h1><span aria-hidden="true">☀</span> Sistema Solar</h1>
  </div>
  <div class="ctrl-section">
    <label>Reproducción</label>
    <div class="btn-group">
      <button class="btn btn-play active" id="btn-play" onclick="togglePlay()" aria-label="Reproducir / Pausar">▶</button>
      <button class="btn" onclick="resetView()" aria-label="Restablecer vista">↺ Reset</button>
    </div>
  </div>
  <div class="ctrl-section">
    <label>Velocidad orbital</label>
    <input type="range" id="speed-slider" min="0.1" max="5" step="0.1" value="1" oninput="changeSpeed(this.value)" autocomplete="off" name="speed">
    <div class="speed-val" id="speed-val" aria-live="polite">1.0x</div>
  </div>
  <div class="ctrl-section">
    <label>Visibilidad</label>
    <div class="toggle-row"><span>Órbitas</span><button class="toggle on" id="toggle-orbits" onclick="toggleOption('orbits')" type="button" aria-label="Alternar órbitas"></button></div>
    <div class="toggle-row"><span>Etiquetas</span><button class="toggle on" id="toggle-labels" onclick="toggleOption('labels')" type="button" aria-label="Alternar etiquetas"></button></div>
    <div class="toggle-row"><span>Asteroides</span><button class="toggle on" id="toggle-asteroids" onclick="toggleOption('asteroids')" type="button" aria-label="Alternar asteroides"></button></div>
    <div class="toggle-row"><span>Constelaciones</span><button class="toggle on" id="toggle-constellations" onclick="toggleOption('constellations')" type="button" aria-label="Alternar constelaciones"></button></div>
  </div>
  <div class="ctrl-section">
    <label>Catálogo</label>
    <input type="text" id="search-input" placeholder="Buscar planeta, estrella…" oninput="filterCatalog(this.value)" autocomplete="off" name="search">
    <button class="cat-header open" onclick="toggleCat(this,'planets')" type="button" aria-expanded="true">
      <div class="cat-header-left"><span class="cat-icon" aria-hidden="true">🪐</span><span class="cat-name">Planetas</span><span class="cat-count">8</span></div>
      <span class="cat-arrow">▸</span>
    </button>
    <div class="cat-list open" id="cat-planets"><div class="cat-list-inner" id="planet-buttons"></div></div>

    <button class="cat-header" onclick="toggleCat(this,'asteroids')" type="button" aria-expanded="false">
      <div class="cat-header-left"><span class="cat-icon" aria-hidden="true">☄️</span><span class="cat-name">Asteroides</span><span class="cat-count">4</span></div>
      <span class="cat-arrow">▸</span>
    </button>
    <div class="cat-list" id="cat-asteroids"><div class="cat-list-inner" id="asteroid-buttons"></div></div>

    <button class="cat-header" onclick="toggleCat(this,'stars')" type="button" aria-expanded="false">
      <div class="cat-header-left"><span class="cat-icon" aria-hidden="true">⭐</span><span class="cat-name">Estrellas</span><span class="cat-count">10</span></div>
      <span class="cat-arrow">▸</span>
    </button>
    <div class="cat-list" id="cat-stars"><div class="cat-list-inner" id="star-buttons"></div></div>

    <button class="cat-header" onclick="toggleCat(this,'blackholes')" type="button" aria-expanded="false">
      <div class="cat-header-left"><span class="cat-icon" aria-hidden="true">🕳️</span><span class="cat-name">Agujeros Negros</span><span class="cat-count">6</span></div>
      <span class="cat-arrow">▸</span>
    </button>
    <div class="cat-list" id="cat-blackholes"><div class="cat-list-inner" id="blackhole-buttons"></div></div>

    <button class="cat-header" onclick="toggleCat(this,'constellations')" type="button" aria-expanded="false">
      <div class="cat-header-left"><span class="cat-icon" aria-hidden="true">✦</span><span class="cat-name">Constelaciones</span><span class="cat-count">21</span></div>
      <span class="cat-arrow">▸</span>
    </button>
    <div class="cat-list" id="cat-constellations"><div class="cat-list-inner" id="constellation-buttons"></div></div>
  </div>
</div>

<div id="info-panel">
  <div class="info-handle"></div>
  <button class="close-btn" onclick="closeInfo()" aria-label="Cerrar información">✕</button>
  <h3 id="info-name"><span class="planet-dot" id="info-dot"></span> <span id="info-title"></span></h3>
  <div class="subtitle" id="info-type"></div>
  <div class="data-grid" id="info-data"></div>
  <div class="fun-fact" id="info-fact"></div>
</div>

<div id="zoom-indicator" aria-live="polite">Zoom: 100%</div>
<div id="mobile-follow-bar"><span id="mobile-follow-name"></span><button id="mobile-reset-btn" onclick="resetView()" aria-label="Restablecer vista">↺</button></div>

<script src="app.js" defer></script>
</body>
</html>
